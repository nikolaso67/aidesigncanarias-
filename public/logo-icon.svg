<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="4" y="4" width="92" height="92" rx="19" ry="19" fill="none" stroke="white" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Neural network lines -->
  <line x1="50" y1="26" x2="30" y2="64" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="50" y1="26" x2="70" y2="64" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="30" y1="64" x2="70" y2="64" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="50" y1="64" x2="50" y2="80" stroke="white" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Neural nodes -->
  <circle cx="50" cy="26" r="5.5" fill="white"/>
  <circle cx="30" cy="64" r="5.5" fill="white"/>
  <circle cx="70" cy="64" r="5.5" fill="white"/>
  <circle cx="50" cy="80" r="3.5" fill="white" fill-opacity="0.6"/>

</svg>
