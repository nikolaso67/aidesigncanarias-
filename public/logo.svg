<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagon mark — center (50,50) circumradius 44 -->
  <polygon
    points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28"
    fill="url(#hexGrad)"
    filter="url(#glow)"
  />

  <!-- Neural network lines -->
  <line x1="50" y1="27" x2="34" y2="63" stroke="white" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="50" y1="27" x2="66" y2="63" stroke="white" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="34" y1="63" x2="66" y2="63" stroke="white" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="50" y1="63" x2="50" y2="79" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Neural nodes -->
  <circle cx="50" cy="27" r="4.5" fill="white"/>
  <circle cx="34" cy="63" r="4.5" fill="white"/>
  <circle cx="66" cy="63" r="4.5" fill="white"/>
  <circle cx="50" cy="79" r="3" fill="white" fill-opacity="0.65"/>

  <!-- Wordmark: AI Design -->
  <text
    x="112" y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist', 'Segoe UI', sans-serif"
    font-size="33"
    font-weight="800"
    fill="#0f172a"
    letter-spacing="-0.8"
  >AI Design</text>

  <!-- Divider dot -->
  <circle cx="107" cy="70" r="2" fill="#6366f1"/>

  <!-- Wordmark: CANARIAS -->
  <text
    x="116" y="76"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist', 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="600"
    fill="#6366f1"
    letter-spacing="4.5"
  >CANARIAS</text>

</svg>
